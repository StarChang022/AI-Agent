$kind: http-request
description: "建立或更新基本預算範本；amount=0 → 刪除既有；(category_id,cycle) 唯一"
url: "{{base_url}}/api/budget-templates"
method: PUT
header:
  - key: Authorization
    value: "Bearer {{token}}"
body:
  type: json
  content: |-
    {
        "category_id":"{{category_id}}",
        "cycle":"month",
        "amount":3000
    }
order: 3201

# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  generate_recurring_records:
    class: GenerateRecurringRecordsJob
    queue: default
    # 台北 00:30 = UTC 16:30（server 以 UTC 執行 cron），要排在 09:00 逾期通知之前。
    schedule: "30 16 * * *"
  notify_overdue_payouts:
    class: NotifyOverduePayoutsJob
    queue: default
    # 台北 09:00 = UTC 01:00（server 以 UTC 執行 cron）。job 內以 Asia/Taipei 判定當日。
    schedule: "0 1 * * *"
  purge_stale_uploads:
    class: PurgeStaleUploadsJob
    queue: default
    # 台北 03:00 = UTC 19:00（server 以 UTC 執行 cron）。
    schedule: "0 19 * * *"
  clean_up_data_exports:
    class: CleanUpDataExportsJob
    queue: default
    # 每小時第 30 分。刪除已失效的匯出檔、回收卡住的匯出（docs/資料模型.md §3.7）；每小時跑，卡住的匯出最晚約 4 小時內變成失敗並通知。
    schedule: "30 * * * *"

services:
  db:
    image: postgres:16-alpine
    container_name: quickey-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: quickey_development
    volumes:
      - quickey_pgdata:/var/lib/postgresql/data
      - ./script/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  quickey_pgdata:

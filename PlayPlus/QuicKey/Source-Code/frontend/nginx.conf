# Quickey 前端：Nginx server config
#
# 1. 服務 Vite 打包後的靜態檔（SPA fallback 到 index.html）
# 2. 把 /api/* 反向代理到 Rails backend（compose 內 service name：backend）
# 3. Cloudflare 代理模式：從 CF-Connecting-IP header 還原真實 client IP
#    Cloudflare IP 清單來源：https://www.cloudflare.com/ips/
#    （Cloudflare 偶爾會調整，必要時同步 set_real_ip_from）

upstream backend_upstream {
    server backend:80;
}

# ---- Cloudflare real IP 還原（IPv4）----
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
# ---- Cloudflare real IP 還原（IPv6）----
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# ---- Gzip ----
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    application/wasm
    image/svg+xml;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 憑證照片／PDF 上傳用（之後接 OCR 會傳大檔）
    client_max_body_size 20M;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # ---- API 反向代理 ----
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Rails health check（給 Uptime Kuma 之類監控打）
    location = /up {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
    }

    # ---- PWA：Service Worker 不可長期快取 ----
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        try_files $uri =404;
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # ---- Vite 打包的 assets 檔名帶 hash → 可長期 immutable ----
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ---- SPA fallback ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
